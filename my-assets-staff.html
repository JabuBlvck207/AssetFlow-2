<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AssetFlow - My Assigned Assets">
  <title>My Assigned Assets | AssetFlow</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="app-layout">
    <!-- Staff Sidebar -->
    <nav class="sidebar" aria-label="Main navigation">
      <header class="sidebar-header">
        <div class="logo">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect width="40" height="40" rx="10" fill="#2563eb"/>
            <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text">AssetFlow</span>
        </div>
        <button class="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
        </button>
      </header>

       <ul class="nav-menu" role="menubar">
        <li role="none"><a href="dashboard-staff.html" class="nav-link">Dashboard</a></li>
        <li role="none"><a href="my-assets-staff.html" class="nav-link">My Assigned Assets</a></li>
        <li role="none"><a href="maintenance-staff.html" class="nav-link">Maintenance</a></li>
        <li role="none"><a href="requests-staff.html" class="nav-link active">Requests</a></li>
      </ul>

      <footer class="sidebar-footer">
        <article class="user-profile">
          <div class="user-avatar" aria-hidden="true"><span id="userInitials">JD</span></div>
          <div class="user-info">
            <strong id="userName">John Doe</strong>
            <span id="userRole">Staff</span>
          </div>
        </article>
        <button onclick="logout()" class="btn-logout">Sign Out</button>
      </footer>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <h1>My Assigned Assets</h1>
          <p class="breadcrumb">Assets currently assigned to me</p>
        </div>
      </header>

      <section class="content-card table-card">
        <header class="card-header">
          <h2>Currently Assigned Assets</h2>
          <span id="showingText" class="table-meta">Showing 0 assets</span>
        </header>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Asset Name</th>
                <th>Status</th>
                <th>Assigned Date</th>
                <th>Expected Return</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="myAssetsTable"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/my-assets-staff.js"></script>
</body>
</html>
