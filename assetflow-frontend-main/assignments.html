<dialog id="assignModal" class="modal" aria-labelledby="modal-title" aria-modal="true">
<form id="assignForm" class="modal-form" method="dialog">
<header class="modal-header">
<h2 id="modal-title">Assign Asset</h2>
<button type="button" class="modal-close" onclick="closeAssignModal()" aria-label="Close dialog">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<line x1="18" y1="6" x2="6" y2="18"/>
<line x1="6" y1="6" x2="18" y2="18"/>
</svg>
</button>
</header>
<section class="modal-body">
<section class="form-row">
<section class="form-group">
<label for="assignAsset">Asset <span aria-label="required">*</span></label>
<select id="assignAsset" name="asset_id" required>
<option value="">Select asset</option>
<option value="1">MacBook Pro 16" M3 Max</option>
<option value="2">Dell UltraSharp 27" Monitor</option>
<option value="3">iPhone 15 Pro 256GB</option>
<option value="5">Logitech MX Master 3S</option>
<option value="9">Dell PowerEdge Server</option>
<option value="11">Cisco IP Phone 8841</option>
</select>
</section>
<section class="form-group">
<label for="assignEmployee">Employee <span aria-label="required">*</span></label>
<select id="assignEmployee" name="employee_id" required>
<option value="">Select employee</option>
<option value="sarah-chen">Sarah Chen</option>
<option value="mike-johnson">Mike Johnson</option>
<option value="emily-davis">Emily Davis</option>
<option value="alex-wilson">Alex Wilson</option>
</select>
</section>
</section>
<section class="form-row">
<section class="form-group">
<label for="assignDate">Assignment Date <span aria-label="required">*</span></label>
<input type="date" id="assignDate" name="assigned_date" required>
</section>
<section class="form-group">
<label for="dueDate">Expected Return Date</label>
<input type="date" id="dueDate" name="due_date">
</section>
</section>
<section class="form-group">
<label for="assignNotes">Notes</label>
<textarea id="assignNotes" name="notes" rows="3" placeholder="Add any additional details..."></textarea>
</section>
</section>
<footer class="modal-footer">
<button type="button" class="btn btn-secondary" onclick="closeAssignModal()">Cancel</button>
<button type="submit" class="btn btn-primary">
<span class="btn-text">Assign Asset</span>
<span class="btn-loader" aria-hidden="true"></span>
</button>
</footer>
</form>
</dialog>

<dialog id="returnModal" class="modal" aria-labelledby="return-modal-title" aria-modal="true">
<form id="returnForm" class="modal-form" method="dialog">
<header class="modal-header">
<h2 id="return-modal-title">Return Asset</h2>
<button type="button" class="modal-close" onclick="closeReturnModal()" aria-label="Close dialog">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<line x1="18" y1="6" x2="6" y2="18"/>
<line x1="6" y1="6" x2="18" y2="18"/>
</svg>
</button>
</header>
<section class="modal-body">
<input type="hidden" id="returnAssignmentId" name="assignment_id">
<section class="form-group">
<label for="returnCondition">Return Condition <span aria-label="required">*</span></label>
<select id="returnCondition" name="condition" required>
<option value="good">Good - No issues</option>
<option value="fair">Fair - Minor wear</option>
<option value="damaged">Damaged - Needs repair</option>
<option value="lost">Lost - Cannot be located</option>
</select>
</section>
<section class="form-group">
<label for="returnNotes">Return Notes</label>
<textarea id="returnNotes" name="return_notes" rows="3" placeholder="Describe the condition or any issues..."></textarea>
</section>
</section>
<footer class="modal-footer">
<button type="button" class="btn btn-secondary" onclick="closeReturnModal()">Cancel</button>
<button type="submit" class="btn btn-primary">
<span class="btn-text">Confirm Return</span>
<span class="btn-loader" aria-hidden="true"></span>
</button>
</footer>
</form>
</dialog>

<section id="toastContainer" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></section>
