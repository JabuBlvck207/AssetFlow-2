<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AssetFlow - User Management">
  <title>Users | AssetFlow</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="app-layout">
    <nav class="sidebar" aria-label="Main navigation">
      <!-- Same sidebar as other admin pages -->
      <header class="sidebar-header">
        <div class="logo">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="#2563eb"/><path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="logo-text">AssetFlow</span>
        </div>
      </header>

      <ul class="nav-menu" role="menubar">
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="assets.html" class="nav-link">Assets</a></li>
        <li><a href="users.html" class="nav-link active">Users</a></li>
        <li><a href="reports.html" class="nav-link">Reports</a></li>
      </ul>

      <footer class="sidebar-footer">
        <article class="user-profile">
          <div class="user-avatar"><span id="userInitials">AD</span></div>
          <div class="user-info">
            <strong id="userName">Admin User</strong>
            <span id="userRole">Administrator</span>
          </div>
        </article>
        <button onclick="logout()" class="btn-logout">Sign Out</button>
      </footer>
    </nav>

    <main id="main-content" class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <h1>User Management</h1>
          <p class="breadcrumb">Manage users and roles</p>
        </div>
        <button onclick="openNewUserModal()" class="btn btn-primary">Add New User</button>
      </header>

      <section class="content-card table-card">
        <header class="card-header">
          <h2>All Users</h2>
          <span id="showingText" class="table-meta">Showing 0 users</span>
        </header>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersTable"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
