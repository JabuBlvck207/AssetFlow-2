<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AssetFlow Assets - Manage all your assets">
  <title>Assets | AssetFlow</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <nav class="sidebar" aria-label="Main navigation">
      <header class="sidebar-header">
        <div class="logo">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect width="40" height="40" rx="10" fill="#2563eb"/>
            <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text">AssetFlow</span>
        </div>
        <button class="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
        </button>
      </header>

      <ul class="nav-menu" role="menubar">
        <li role="none">
          <a href="dashboard.html" class="nav-link" role="menuitem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li role="none">
          <a href="assets.html" class="nav-link active" role="menuitem" aria-current="page">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span>Assets</span>
            <span class="nav-badge" id="assetCount">0</span>
          </a>
        </li>
        <li role="none">
          <a href="assignments.html" class="nav-link" role="menuitem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
            <span>Assignments</span>
          </a>
        </li>
        <li role="none">
          <a href="maintenance.html" class="nav-link" role="menuitem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Maintenance</span>
            <span class="nav-badge badge-alert" id="maintenanceCount">3</span>
          </a>
        </li>
        <li role="none">
          <a href="reports.html" class="nav-link" role="menuitem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span>Reports</span>
          </a>
        </li>
      </ul>

      <footer class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" aria-hidden="true">
            <span id="userInitials">--</span>
          </div>
          <div class="user-info">
            <strong id="userName">User</strong>
            <span id="userRole">Loading...</span>
          </div>
        </div>
        <button onclick="logout()" class="btn-logout" aria-label="Sign out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Sign Out</span>
        </button>
      </footer>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <h1>Assets</h1>
          <p class="breadcrumb" aria-label="Breadcrumb">Manage and track all company assets</p>
        </div>
        <div class="top-bar-right">
          <button class="icon-btn" aria-label="Notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="notification-dot" aria-label="3 unread notifications"></span>
          </button>
        </div>
      </header>

      <!-- Toolbar -->
      <section class="toolbar" aria-label="Asset controls">
        <div class="toolbar-left">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input 
              type="search" 
              id="search" 
              placeholder="Search assets by name, location, or status..." 
              oninput="searchAssets()"
              aria-label="Search assets"
            >
          </div>
          <div class="filter-group">
            <select id="statusFilter" aria-label="Filter by status">
              <option value="">All Statuses</option>
              <option value="available">Available</option>
              <option value="in-use">In Use</option>
              <option value="maintenance">Maintenance</option>
              <option value="retired">Retired</option>
            </select>
            <select id="locationFilter" aria-label="Filter by location">
              <option value="">All Locations</option>
              <option value="hq">Headquarters</option>
              <option value="branch-a">Branch A</option>
              <option value="branch-b">Branch B</option>
              <option value="remote">Remote</option>
            </select>
          </div>
        </div>
        <div class="toolbar-right">
          <button onclick="openCreateAsset()" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Asset
          </button>
        </div>
      </section>

      <!-- Assets Table -->
      <section class="content-card table-card" aria-labelledby="assets-heading">
        <header class="card-header">
          <h2 id="assets-heading" class="visually-hidden">Assets List</h2>
          <div class="table-meta">
            <span id="showingText">Showing 0 assets</span>
          </div>
        </header>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th scope="col">
                  <label class="checkbox-label table-checkbox">
                    <input type="checkbox" id="selectAll" aria-label="Select all assets">
                    <span class="checkmark"></span>
                  </label>
                </th>
                <th scope="col">
                  <button class="sort-btn" data-sort="name" aria-label="Sort by name">
                    Asset Name
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
                  </button>
                </th>
                <th scope="col">
                  <button class="sort-btn" data-sort="status" aria-label="Sort by status">
                    Status
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
                  </button>
                </th>
                <th scope="col">
                  <button class="sort-btn" data-sort="location" aria-label="Sort by location">
                    Location
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
                  </button>
                </th>
                <th scope="col">
                  <button class="sort-btn" data-sort="assigned" aria-label="Sort by assigned to">
                    Assigned To
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
                  </button>
                </th>
                <th scope="col">
                  <button class="sort-btn" data-sort="date" aria-label="Sort by date">
                    Last Updated
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
                  </button>
                </th>
                <th scope="col" class="actions-col">Actions</th>
              </tr>
            </thead>
            <tbody id="assetTable">
              <!-- Skeleton loading state -->
              <tr class="skeleton-row">
                <td><div class="skeleton-box" style="width: 18px; height: 18px;"></div></td>
                <td><div class="skeleton-line" style="width: 70%;"></div></td>
                <td><div class="skeleton-line" style="width: 50%;"></div></td>
                <td><div class="skeleton-line" style="width: 60%;"></div></td>
                <td><div class="skeleton-line" style="width: 50%;"></div></td>
                <td><div class="skeleton-line" style="width: 60%;"></div></td>
                <td><div class="skeleton-line" style="width: 40%;"></div></td>
              </tr>
              <tr class="skeleton-row">
                <td><div class="skeleton-box" style="width: 18px; height: 18px;"></div></td>
                <td><div class="skeleton-line" style="width: 60%;"></div></td>
                <td><div class="skeleton-line" style="width: 40%;"></div></td>
                <td><div class="skeleton-line" style="width: 50%;"></div></td>
                <td><div class="skeleton-line" style="width: 60%;"></div></td>
                <td><div class="skeleton-line" style="width: 50%;"></div></td>
                <td><div class="skeleton-line" style="width: 30%;"></div></td>
              </tr>
              <tr class="skeleton-row">
                <td><div class="skeleton-box" style="width: 18px; height: 18px;"></div></td>
                <td><div class="skeleton-line" style="width: 80%;"></div></td>
                <td><div class="skeleton-line" style="width: 55%;"></div></td>
                <td><div class="skeleton-line" style="width: 45%;"></div></td>
                <td><div class="skeleton-line" style="width: 55%;"></div></td>
                <td><div class="skeleton-line" style="width: 65%;"></div></td>
                <td><div class="skeleton-line" style="width: 45%;"></div></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <footer class="table-footer">
          <div class="pagination-info">
            <span id="paginationText">Page 1 of 1</span>
          </div>
          <nav class="pagination" aria-label="Asset pagination">
            <button class="btn-page" disabled aria-label="Previous page">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="btn-page active" aria-current="page" aria-label="Page 1">1</button>
            <button class="btn-page" disabled aria-label="Next page">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </nav>
        </footer>
      </section>
    </main>
  </div>

  <!-- Create Asset Modal -->
  <dialog id="createAssetModal" class="modal" aria-labelledby="modal-title" aria-modal="true">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="modal-title">Add New Asset</h2>
        <button class="modal-close" onclick="closeCreateAsset()" aria-label="Close dialog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <form id="createAssetForm" class="modal-form">
        <div class="form-row">
          <div class="form-group">
            <label for="assetName">Asset Name *</label>
            <input type="text" id="assetName" name="name" required placeholder="e.g., MacBook Pro 16"">
          </div>
          <div class="form-group">
            <label for="assetCategory">Category</label>
            <select id="assetCategory" name="category">
              <option value="">Select category</option>
              <option value="laptop">Laptop</option>
              <option value="desktop">Desktop</option>
              <option value="mobile">Mobile Device</option>
              <option value="peripheral">Peripheral</option>
              <option value="furniture">Furniture</option>
              <option value="vehicle">Vehicle</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="assetStatus">Status *</label>
            <select id="assetStatus" name="status" required>
              <option value="available">Available</option>
              <option value="in-use">In Use</option>
              <option value="maintenance">Maintenance</option>
              <option value="retired">Retired</option>
            </select>
          </div>
          <div class="form-group">
            <label for="assetLocation">Location *</label>
            <select id="assetLocation" name="location" required>
              <option value="">Select location</option>
              <option value="hq">Headquarters</option>
              <option value="branch-a">Branch A</option>
              <option value="branch-b">Branch B</option>
              <option value="remote">Remote</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="assetDescription">Description</label>
          <textarea id="assetDescription" name="description" rows="3" placeholder="Add any additional details..."></textarea>
        </div>
        <footer class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeCreateAsset()">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <span class="btn-text">Create Asset</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </footer>
      </form>
    </div>
  </dialog>

  <!-- Toast Notifications -->
  <div id="toastContainer" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/assets.js"></script>
</body>
</html>
