<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AssetFlow - All Assets Management">
  <title>All Assets | AssetFlow</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="app-layout">
    <!-- Asset Manager Sidebar -->
    <nav class="sidebar" aria-label="Main navigation">
      <header class="sidebar-header">
        <div class="logo">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect width="40" height="40" rx="10" fill="#2563eb"/>
            <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text">AssetFlow</span>
        </div>
        <button class="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
        </button>
      </header>

      <ul class="nav-menu" role="menubar">
        <li role="none"><a href="asset-manager-dashboard.html" class="nav-link">Dashboard</a></li>
        <li role="none"><a href="all-assets-manager.html" class="nav-link">All Assets</a></li>
        <li role="none"><a href="asset-manager.html" class="nav-link">Manage Assignments</a></li>
        <li role="none"><a href="maintenance-manager.html" class="nav-link">Maintenance</a></li>
        <li role="none"><a href="reports-manager.html" class="nav-link active">Reports</a></li>
      </ul>

      <footer class="sidebar-footer">
        <article class="user-profile">
          <div class="user-avatar" aria-hidden="true"><span id="userInitials">AM</span></div>
          <div class="user-info">
            <strong id="userName">Alex Rivera</strong>
            <span id="userRole">Asset Manager</span>
          </div>
        </article>
        <button onclick="logout()" class="btn-logout">Sign Out</button>
      </footer>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <h1>All Assets</h1>
          <p class="breadcrumb">Complete company asset inventory</p>
        </div>
        <div class="top-bar-right">
          <button onclick="openCreateAsset()" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add New Asset
          </button>
        </div>
      </header>

      <!-- Toolbar -->
      <section class="toolbar" aria-label="Asset controls">
        <div class="toolbar-left">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input 
              type="search" 
              id="search" 
              placeholder="Search by name, serial number, or assigned user..." 
              oninput="searchAssets()">
          </div>
          <div class="filter-group">
            <select id="statusFilter" onchange="searchAssets()">
              <option value="">All Statuses</option>
              <option value="available">Available</option>
              <option value="in-use">In Use</option>
              <option value="maintenance">Maintenance</option>
              <option value="retired">Retired</option>
            </select>
            <select id="categoryFilter" onchange="searchAssets()">
              <option value="">All Categories</option>
              <option value="laptop">Laptop</option>
              <option value="desktop">Desktop</option>
              <option value="mobile">Mobile Device</option>
              <option value="peripheral">Peripheral</option>
              <option value="furniture">Furniture</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="toolbar-right">
          <button onclick="exportAssets()" class="btn btn-secondary">Export CSV</button>
        </div>
      </section>

      <!-- Assets Table -->
      <section class="content-card table-card">
        <header class="card-header">
          <h2>All Assets</h2>
          <span id="showingText" class="table-meta">Showing 0 assets</span>
        </header>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                <th>Asset Name</th>
                <th>Category</th>
                <th>Status</th>
                <th>Location</th>
                <th>Assigned To</th>
                <th>Last Updated</th>
                <th class="actions-col">Actions</th>
              </tr>
            </thead>
            <tbody id="assetTable"></tbody>
          </table>
        </div>

        <footer class="table-footer">
          <div class="pagination-info">
            <span id="paginationText">Page 1 of 1</span>
          </div>
          <nav class="pagination" aria-label="Pagination"></nav>
        </footer>
      </section>
    </main>
  </div>

  <!-- Toast Notifications -->
  <div id="toastContainer" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/all-assets-manager.js"></script>
</body>
</html>
